name: Mayo TV APK

# Baut bei jedem Push auf main oder einen Arbeitszweig eine signierte Release-APK. Sie landet zweimal
# in den Releases: unter der festen Adresse im Release "latest" (zum Laden am Fernseher) und als
# Release v1.0.<Lauf>. Der Updater in der App fragt GitHubs neuestes Release ab und vergleicht dessen
# Tag mit der installierten Version. Als "neuestes" gilt nur ein Bau von main; Arbeitszweige legen ihr
# Release als Vorabversion an, die der Updater nicht anbietet.
on:
  push:
    branches: [ "main", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Keine concurrency-Gruppe mit cancel-in-progress: jeder abgebrochene Lauf schickt eine Mail.
# Überholte Läufe erkennt der Job "current" und überspringt den Rest.

jobs:
  # Überholte Pushes: ist der Zweig schon weiter, bleibt dieser Lauf still grün statt zu bauen.
  current:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.head.outputs.stale }}
    steps:
      - id: head
        env:
          REF: ${{ github.ref }}
        run: |
          HEAD=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "$REF" | cut -f1)
          if [ -n "$HEAD" ] && [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "::notice::Überholt von ${HEAD::7}, dieser Lauf baut nichts."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: current
    if: needs.current.outputs.stale != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Das Android-SDK ist auf ubuntu-latest vorinstalliert; fehlende Plattformen lädt Gradle nach.
      - uses: gradle/actions/setup-gradle@v6

      # Signiert wird mit dem Schlüssel aus dem Secret KEYSTORE_BASE64, damit jede neue APK sich über
      # die alte installiert. Fehlt das Secret, entsteht ein einmaliger Schlüssel nur für diesen Lauf.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          else
            echo "::warning::Secret KEYSTORE_BASE64 fehlt, diese APK bekommt einen einmaligen Schlüssel."
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias sideload \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mayo TV"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          FLUTLICHT_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          MAYO_TYPESAFE_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          MAYO_ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: sideload
          KEY_PASSWORD: android
        run: |
          export VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          chmod +x ./gradlew
          ./gradlew assembleStandardRelease --stacktrace
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)" dist/MayoTV.apk
          cp dist/MayoTV.apk "dist/MayoTV-v1.0.${GITHUB_RUN_NUMBER}.apk"
          # Bis 2026-10 hieß die App Flutlicht: gespeicherte Download-Links auf .../latest/Flutlicht.apk
          # bekommen vorerst dieselbe APK.
          cp dist/MayoTV.apk dist/Flutlicht.apk

      # Dex-Metadaten: das mitgelieferte Basisprofil als .dm neben die APK. Die App legt es beim Update
      # in die Installation, damit Android den Code gleich beim Einspielen vorübersetzt. Scheitert das,
      # bleibt es beim bisherigen Weg (Profil wartet auf die nächtliche Kompilierung).
      - name: Build dex metadata (.dm)
        continue-on-error: true
        run: |
          set -e
          work=$(mktemp -d)
          unzip -p dist/MayoTV.apk assets/dexopt/baseline.prof > "$work/baseline.prof"
          unzip -p dist/MayoTV.apk assets/dexopt/baseline.profm > "$work/baseline.profm" || rm -f "$work/baseline.profm"
          echo "baseline.prof header:"; head -c 8 "$work/baseline.prof" | od -c | head -1
          # The APK carries the profile in format 010; Android 12+ reads 015 only and ignores anything else.
          # Convert it with the same transcoder the app's profile installer uses at runtime.
          jar=$(find "$HOME/.gradle" -path '*profileinstaller*' -name classes.jar | head -n1)
          echo "profileinstaller jar: $jar"
          mkdir -p "$work/cls"
          javac -nowarn -cp "$jar" -d "$work/cls" tools/dm/MakeDm.java
          java -cp "$jar:$work/cls" androidx.profileinstaller.MakeDm "$work/baseline.prof" "$work/baseline.profm" base.apk "$work/primary.prof"
          echo "primary.prof header:"; head -c 8 "$work/primary.prof" | od -c | head -1
          (cd "$work" && zip -q -X "$GITHUB_WORKSPACE/dist/MayoTV-v1.0.${GITHUB_RUN_NUMBER}.dm" primary.prof)
          unzip -l "dist/MayoTV-v1.0.${GITHUB_RUN_NUMBER}.dm"

      - uses: actions/upload-artifact@v7
        with:
          name: MayoTV
          path: dist/MayoTV.apk
          if-no-files-found: error

      # R8-Zuordnung, um simpleperf-Profile von der Box (tools/box) wieder lesbar zu machen.
      - uses: actions/upload-artifact@v7
        with:
          name: mapping
          path: app/build/outputs/mapping/standardRelease/mapping.txt
          if-no-files-found: warn

      # Läufe desselben Zweigs können sich überholen; veröffentlicht wird nur, was noch der neueste
      # Stand ist, sonst zeigte "latest" am Ende auf einen älteren Bau.
      - name: Still the newest push?
        id: newest
        env:
          REF: ${{ github.ref }}
        run: |
          HEAD=$(git ls-remote origin "$REF" | cut -f1)
          if [ -n "$HEAD" ] && [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "::notice::Überholt von ${HEAD::7}, diese APK wird nicht veröffentlicht."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Ein Release behält seinen Tag; damit "latest" zum gebauten Stand passt, wird der Tag mitgezogen.
      - name: Move tag "latest"
        if: steps.newest.outputs.ok == 'true'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish "latest" release
        if: steps.newest.outputs.ok == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Neueste Version
          prerelease: true
          make_latest: false
          body: "Automatisch gebaut aus ${{ github.ref_name }} @ ${{ github.sha }} (Version 1.0.${{ github.run_number }})"
          files: |
            dist/MayoTV.apk
            dist/Flutlicht.apk

      # Der Text des Releases erscheint in der App unter "Neuerungen": die Commits seit dem letzten
      # erfolgreichen Bau dieses Zweigs, ohne Merges und ohne reine Tour-/CI-Pflege.
      - name: Release notes
        if: steps.newest.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tvplayer.yml --branch "$GITHUB_REF_NAME" \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null && [ "$PREV" != "$GITHUB_SHA" ]; then
            RANGE="$PREV..$GITHUB_SHA"
          else
            RANGE="-n 10 $GITHUB_SHA"
          fi
          {
            echo "### Neu in Version 1.0.${GITHUB_RUN_NUMBER}"
            git log --no-merges --format='%s' $RANGE \
              | grep -viE '^(Tour|CI|Screens?|Starttest|README)\b|hereingemergt|^Merge ' \
              | head -n 15 | sed 's/^/- /'
            echo
            echo "Gebaut aus ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish versioned release for the in-app updater
        if: steps.newest.outputs.ok == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mayo TV 1.0.${{ github.run_number }}
          # Nur main ist ein Update für den Fernseher; Arbeitszweige bleiben Vorabversionen.
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          body_path: dist/notes.md
          files: |
            dist/MayoTV-v1.0.${{ github.run_number }}.apk
            dist/MayoTV-v1.0.${{ github.run_number }}.dm
