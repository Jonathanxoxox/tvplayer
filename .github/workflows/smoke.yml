name: Mayo TV Starttest

# Startet die App auf einem Emulator und schreibt Absturzmeldungen ins Log, damit ein Fehler beim
# Start ohne Fernseher sichtbar wird.
on:
  push:
    branches: [ "main", "claude/**" ]
  workflow_dispatch:

# Keine concurrency-Gruppe mit cancel-in-progress: jeder abgebrochene Lauf schickt eine Mail.
# Überholte Läufe erkennt der Job "current" und überspringt den Rest.

jobs:
  # Überholte Pushes: ist der Zweig schon weiter, bleibt dieser Lauf still grün statt zu bauen.
  current:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.head.outputs.stale }}
    steps:
      - id: head
        env:
          REF: ${{ github.ref }}
        run: |
          HEAD=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "$REF" | cut -f1)
          if [ -n "$HEAD" ] && [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "::notice::Überholt von ${HEAD::7}, dieser Lauf baut nichts."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  # Alle JVM-Tests der App (Fußball-Erkennung, Launcher-Zeilen, Tastenbelegung, Einstellungen, Untertitel …).
  tests:
    needs: current
    if: needs.current.outputs.stale != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Core fork
        run: bash tools/ci/core-fork.sh

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

  # Android Lint (abortOnError in app/build.gradle.kts): fängt z. B. fehlende Plurals, falsche
  # Ressourcen und API-Level-Fehler, bevor sie erst im Release-Build oder auf der Box auffallen.
  lint:
    needs: current
    if: needs.current.outputs.stale != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Core fork
        run: bash tools/ci/core-fork.sh

      - name: Lint
        run: |
          chmod +x ./gradlew
          ./gradlew lintStandardDebug --stacktrace

      - name: Lint-Bericht
        if: failure()
        run: cat app/build/reports/lint-results-standardDebug.txt 2>/dev/null | head -200 || true

  smoke:
    needs: current
    if: needs.current.outputs.stale != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Core fork
        run: bash tools/ci/core-fork.sh

      - name: Build x86_64 APK
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: sideload
          KEY_PASSWORD: android
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias sideload \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mayo TV"
          export KEYSTORE_FILE="$KS"
          chmod +x ./gradlew
          ./gradlew assembleX86_64Release --stacktrace
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)" dist/app.apk

      - name: List OwnTV strings
        run: |
          for f in $(find app/build/intermediates -path "*mergeX86_64ReleaseResources/merged.dir*" \( -name values.xml -o -name values-de.xml \)); do
            python3 - "$f" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          ET.register_namespace("xliff", "urn:oasis:names:tc:xliff:document:1.2")
          tag = "XMLDE" if sys.argv[1].endswith("values-de.xml") else "XMLEN"
          for e in ET.parse(sys.argv[1]).getroot():
              if e.tag in ("string", "plurals") and re.search(r"OwnTV", "".join(e.itertext())):
                  e.tail = None
                  print(tag, ET.tostring(e, encoding="unicode").replace("\n", " "))
          PY
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r dist/app.apk
            adb logcat -c
            adb shell monkey -p io.github.jonathanxoxox.tvplayer -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "===== RESUMED ====="; adb shell dumpsys activity activities | grep -i "ResumedActivity" || true
            echo "===== CRASH ====="; adb logcat -d -b crash || true
            echo "===== ERRORS ====="; adb logcat -d '*:E' | tail -n 200 || true
            if adb logcat -d -b crash | grep -q "Process: io.github.jonathanxoxox.tvplayer"; then echo "::error::Die App stürzt beim Start ab"; exit 1; fi
