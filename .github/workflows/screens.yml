name: Mayo TV Bildschirm-Tour

# Richtet die App im Emulator (1920×1080, Deutsch) mit einer Test-Playlist ein, läuft per
# Fernbedienungstasten durch Menüs, TV-Guide, Player und Einstellungen und legt die Fotos im Zweig
# screens/<Arbeitszweig> ab. So lassen sich Darstellungsfehler ohne Fernseher prüfen.
# Läuft nur per Start (workflow_dispatch), nicht bei jedem Push.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "Teile der Tour (all oder z. B. vod,scenes,player)"
        default: all

permissions:
  contents: write

# Kein cancel-in-progress: ein abgebrochener Lauf schickt eine Mail. Ein zweiter Start läuft daneben.

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build x86_64 APK
        env:
          FLUTLICHT_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          MAYO_TYPESAFE_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          MAYO_ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: sideload
          KEY_PASSWORD: android
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias sideload \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mayo TV"
          export KEYSTORE_FILE="$KS"
          chmod +x ./gradlew
          ./gradlew assembleX86_64Release -Pmayo.perfLog=true --stacktrace
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)" dist/app.apk

      - name: Test playlist, guide and stream
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pillow
          python3 tools/smoke/fixtures.py fx
          mkdir -p fx/stream
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 \
            -t 120 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -f hls -hls_time 4 \
            -hls_list_size 0 fx/stream/index.m3u8
          nohup python3 -m http.server 8080 --directory fx > http.log 2>&1 &

      - name: Metadaten-Dienst erreichbar?
        continue-on-error: true
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          mkdir -p tour
          if [ -n "$TMDB_KEY" ]; then
            echo "TMDB mit eigenem Schlüssel -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://api.themoviedb.org/3/search/movie?query=Gladiator&api_key=$TMDB_KEY")" | tee -a tour/net.txt
          else
            echo "Kein Secret TMDB_API_KEY" | tee -a tour/net.txt
          fi
          mkdir -p tour
          for u in "https://owntv-tmdb-meta.xiannero.workers.dev/3/search/movie?query=Gladiator&language=de-DE" \
                   "https://tmdb.owntv.me/3/search/movie?query=Gladiator&language=de-DE"; do
            echo "$u -> $(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$u") $(head -c 200 /tmp/body)" | tee -a tour/net.txt
          done

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tour on emulator
        env:
          TOUR_PARTS: ${{ inputs.parts || 'all' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: tv_1080p
          disable-animations: true
          script: bash tools/smoke/screens.sh

      - name: Publish screenshots
        if: always()
        env:
          BRANCH: screens/${{ github.ref_name }}
        run: |
          [ -d tour ] || exit 0
          # Videos (TOUR_PARTS=flicker): jedes geänderte Bild einmal, 6×5 je Bogen, zeilenweise; die Zeit jedes
          # Bildes in <video>.txt, so ist auch zu sehen, wie lange ein Zwischenbild stand.
          for f in tour/*.mp4; do
            [ -e "$f" ] || continue
            ffprobe -v error -select_streams v -show_entries frame=pts_time -of csv=p=0 "$f" > "${f%.mp4}.txt" || true
            ffmpeg -loglevel error -i "$f" -vsync 0 \
              -vf "scale=480:-1,drawtext=text='%{n}':x=8:y=8:fontsize=28:fontcolor=yellow:box=1:boxcolor=black@0.6,tile=6x5:padding=4:color=white" \
              "${f%.mp4}-bogen-%02d.png" \
            || ffmpeg -loglevel error -i "$f" -vsync 0 -vf "scale=480:-1,tile=6x5:padding=4:color=white" "${f%.mp4}-bogen-%02d.png" || true
          done
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in sorted(glob.glob("tour/*.png")):
              try:
                  Image.open(p).convert("RGB").save(p[:-4] + ".jpg", quality=82)
              except Exception as e:
                  print(p, e)
              os.remove(p)
          PY
          cp http.log tour/ 2>/dev/null || true
          cd tour
          git init -q -b screens
          git config user.name "mayotv-ci"; git config user.email "ci@users.noreply.github.com"
          echo "Lauf ${{ github.run_id }} · ${{ github.sha }}" > README.md
          git add -A && git commit -q -m "Bildschirm-Tour ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/$BRANCH
